<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf6f1">
  <meta name="description" content="MOCHI LAB — 用手指揉捏一顆有彈性、有重量、會回彈的數位麻糬。支援多點觸控。">
  <title>MOCHI LAB — A little softer</title>
  <style>
    :root{--ink:#493b3d;--muted:#958a87;--paper:#faf6f1;--line:#e9dfd9;--accent:#d58c98;--ui:#fffdfa}
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink);background:var(--paper);overflow:hidden;-webkit-font-smoothing:antialiased}
    button,input{font:inherit;-webkit-tap-highlight-color:transparent}
    button:focus-visible,input:focus-visible{outline:2px solid #ad7a94;outline-offset:3px}
    .app{position:relative;width:100%;height:100vh;height:100dvh;min-height:400px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 50% 52% at 50% 49%,#fceae6 0%,#fbf4ed 67%,#f9f5f0 100%)}
    .app:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.38;background-image:radial-gradient(#d9c9c2 0.75px,transparent 0.9px);background-size:23px 23px;mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 80%,transparent)}
    .wash{position:absolute;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(circle at 20% 55%,#edc6be58,transparent 31%),radial-gradient(circle at 78% 34%,#ddcee04d,transparent 35%);filter:blur(22px)}
    .circle{position:absolute;z-index:0;border:1px solid #d3b8b128;border-radius:50%;pointer-events:none}
    .circle.a{width:min(70vw,770px);aspect-ratio:1;left:50%;top:53%;transform:translate(-50%,-50%)}
    .circle.b{width:min(56vw,590px);aspect-ratio:1;left:50%;top:53%;transform:translate(-50%,-50%)}
    .topbar{position:absolute;z-index:7;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:calc(25px + env(safe-area-inset-top)) clamp(22px,4vw,62px)}
    .identity{display:flex;align-items:center;gap:13px;font-size:11px;font-weight:750;letter-spacing:.18em;white-space:nowrap}
    .mark{width:32px;height:32px;border-radius:48% 52% 56% 44%;background:linear-gradient(145deg,#fff9f2,#f0a8b6);box-shadow:inset -3px -4px 8px #d88f9a9c,0 3px 9px #cfacaa55;transform:rotate(-13deg)}
    .edition{font-size:10px;letter-spacing:.19em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
    .restart{border:1px solid #e3d4d1;background:#fffbf8b9;color:#6b5557;border-radius:999px;padding:10px 17px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.09em;transition:background .18s,transform .18s}
    .restart:hover{background:#fff;transform:translateY(-2px)}
    .restart svg{width:14px;height:14px}
    .headline{position:absolute;z-index:1;top:clamp(90px,12vh,155px);left:0;right:0;text-align:center;pointer-events:none;user-select:none}
    .eyebrow{font-size:10px;font-weight:700;letter-spacing:.45em;color:#b69996;margin:0 0 13px}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(66px,11vw,144px);font-weight:400;letter-spacing:-.075em;line-height:.9;color:#d9c7c0a6;margin:0}
    h1 em{font-style:italic;font-weight:400;color:#d7bcb7ab}
    .subline{margin-top:18px;color:#b49e9a;font-size:11px;letter-spacing:.22em}
    #stage{position:absolute;z-index:3;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
    #stage.grabbing{cursor:grabbing}
    .side-note{position:absolute;z-index:4;top:50%;left:clamp(20px,4vw,68px);transform:translateY(-50%);pointer-events:none}
    .side-note .line{width:1px;height:36px;background:#cbb0ad;margin:0 0 18px 1px}
    .side-note p{font-size:10px;line-height:2.1;letter-spacing:.18em;color:#9e8987;margin:0;text-transform:uppercase}
    .side-note strong{display:block;font-size:12px;letter-spacing:.06em;color:#775e61;margin-top:3px}
    .active{position:absolute;z-index:4;right:clamp(20px,4vw,65px);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:9px;color:#998580;font-size:10px;font-weight:700;letter-spacing:.12em;pointer-events:none}
    .active-dot{height:7px;width:7px;border-radius:50%;background:#d1c3be;box-shadow:0 0 0 5px #d1c3be25;transition:background .18s}
    .active.engaged .active-dot{background:#d77f91;box-shadow:0 0 0 5px #d77f9130}
    .bottom{position:absolute;z-index:8;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(780px,calc(100% - 36px));display:flex;flex-direction:column;align-items:center;gap:17px}
    .instruction{text-align:center;font-size:12px;line-height:1.7;letter-spacing:.12em;color:#886e6e;pointer-events:none;text-shadow:0 1px 4px #fff}
    .instruction strong{font-weight:750;color:#654e52}
    .panel{width:100%;min-height:86px;display:flex;justify-content:space-between;align-items:center;gap:22px;background:#fffdfacb;border:1px solid #fff;border-radius:23px;padding:17px 25px;box-shadow:0 15px 50px #98716b15,0 2px 9px #9c726a0a;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
    .control{display:flex;flex-direction:column;min-width:145px;gap:10px;flex:1}
    .control-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
    .control label,.swatches .label{font-size:10px;font-weight:800;letter-spacing:.16em;color:#725c60}
    .value{font-family:Georgia,serif;font-size:11px;color:#ac9391}
    input[type=range]{width:100%;margin:0;appearance:none;-webkit-appearance:none;background:transparent;height:15px;cursor:pointer}
    input[type=range]::-webkit-slider-runnable-track{background:#e7d9d5;height:3px;border-radius:99px}
    input[type=range]::-moz-range-track{background:#e7d9d5;height:3px;border-radius:99px}
    input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;margin-top:-6px;width:15px;height:15px;border:3px solid #fff;border-radius:50%;background:#cb8c95;box-shadow:0 1px 5px #ab7e7770}
    input[type=range]::-moz-range-thumb{width:12px;height:12px;border:3px solid #fff;border-radius:50%;background:#cb8c95;box-shadow:0 1px 5px #ab7e7770}
    .separator{width:1px;height:37px;background:#eee4df;flex:none}
    .swatches{display:flex;flex-direction:column;gap:9px;min-width:120px}
    .swatch-row{display:flex;align-items:center;gap:10px}
    .swatch{width:23px;height:23px;flex:none;border:2px solid #fff;border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px #d5c1bc80;transition:transform .2s,box-shadow .2s}
    .swatch:hover{transform:scale(1.14)}
    .swatch[aria-pressed=true]{box-shadow:0 0 0 2px #816466,0 0 0 4px #fff}
    .swatch.rose{background:linear-gradient(135deg,#ffebdc,#dd889d)}.swatch.taro{background:linear-gradient(135deg,#f3e9ff,#aa92d7)}.swatch.matcha{background:linear-gradient(135deg,#e7f6d7,#8dbd9c)}
    .foot{position:absolute;z-index:4;bottom:19px;left:32px;color:#a89a96;font-size:9px;letter-spacing:.2em;pointer-events:none}
    @media(max-width:900px){.side-note{top:57%;left:22px}.active{top:57%;right:22px}.side-note p{font-size:9px}.active{font-size:9px}}
    @media(max-width:650px){
      .topbar{padding:calc(13px + env(safe-area-inset-top)) 18px}
      .edition{display:none}.identity{font-size:10px}.mark{width:27px;height:27px}
      .restart{padding:9px 13px;font-size:10px}
      .headline{top:clamp(96px,15vh,144px)}h1{font-size:clamp(65px,20vw,95px)}
      .eyebrow{font-size:9px;margin-bottom:10px}.subline{margin-top:12px;font-size:9px}
      .side-note{top:auto;bottom:clamp(207px,27vh,250px);left:20px;transform:none}
      .side-note .line{height:18px;margin-bottom:8px}.side-note p{font-size:8px;line-height:1.75}.side-note strong{font-size:9px}
      .active{top:auto;bottom:clamp(213px,28vh,250px);right:20px;transform:none;font-size:8px}
      .bottom{width:calc(100% - 24px);bottom:max(12px,env(safe-area-inset-bottom));gap:11px}
      .instruction{font-size:11px;letter-spacing:.055em}
      .panel{padding:14px 15px;gap:10px;border-radius:18px;min-height:76px}
      .control{min-width:0;gap:9px}.control label,.swatches .label{font-size:9px;letter-spacing:.03em}.value{font-size:10px}
      .separator{height:37px}.swatches{min-width:95px}.swatch-row{gap:8px}.swatch{width:21px;height:21px}
      .foot{display:none}
    }
    @media(max-width:370px){.panel{gap:8px;padding:13px 11px}.swatches{min-width:80px}.swatch-row{gap:5px}.swatch{width:19px;height:19px}.control label{font-size:8px}}
    @media(max-height:620px){.headline{top:70px}.side-note,.active{display:none}.instruction{display:none}.bottom{bottom:max(9px,env(safe-area-inset-bottom))}.panel{min-height:70px;padding-block:11px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:0s!important;animation-duration:0s!important}}
  </style>
</head>
<body>
<main class="app" aria-label="麻糬物理互動實驗室">
  <div class="wash" aria-hidden="true"></div>
  <div class="circle a" aria-hidden="true"></div><div class="circle b" aria-hidden="true"></div>
  <header class="topbar">
    <div class="identity"><span class="mark" aria-hidden="true"></span><span>SOFT MATTER STUDIO</span><span class="edition">/ EXPERIMENT NO. 001</span></div>
    <button class="restart" id="reset" type="button" aria-label="重置麻糬形狀"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.5 6.5"/><path d="M3 4v7h7"/></svg>重新揉捏</button>
  </header>
  <div class="headline" aria-hidden="true">
    <p class="eyebrow">A LITTLE SOFTER EVERY DAY</p>
    <h1>mochi<em>.</em></h1>
    <div class="subline">THE INTERACTIVE SQUISH EXPERIMENT</div>
  </div>
  <canvas id="stage" aria-label="可用單指或多指拖動拉伸的軟彈麻糬"></canvas>
  <div class="side-note" aria-hidden="true"><div class="line"></div><p>TOUCH / STRETCH<br>SQUISH / RELEASE</p><strong>隨心揉捏</strong></div>
  <div class="active" id="active" aria-live="polite"><span class="active-dot"></span><span id="active-text">READY TO SQUISH</span></div>
  <section class="bottom" aria-label="物理材質控制">
    <div class="instruction"><strong>伸出手指，揉一揉。</strong> 雙指拉長、捏扁，放開後看它慢慢回彈。</div>
    <div class="panel">
      <div class="control"><div class="control-head"><label for="spring">彈性 ELASTICITY</label><span class="value" id="spring-value">07</span></div><input id="spring" type="range" min="1" max="10" value="7" aria-label="彈性"></div>
      <span class="separator" aria-hidden="true"></span>
      <div class="control"><div class="control-head"><label for="viscosity">黏性 VISCOSITY</label><span class="value" id="viscosity-value">06</span></div><input id="viscosity" type="range" min="1" max="10" value="6" aria-label="黏性"></div>
      <span class="separator" aria-hidden="true"></span>
      <div class="swatches"><span class="label">口味 FLAVOUR</span><div class="swatch-row" role="group" aria-label="麻糬顏色">
        <button class="swatch rose" data-flavour="rose" aria-label="蜜桃粉" aria-pressed="true"></button>
        <button class="swatch taro" data-flavour="taro" aria-label="芋泥紫" aria-pressed="false"></button>
        <button class="swatch matcha" data-flavour="matcha" aria-label="抹茶綠" aria-pressed="false"></button>
      </div></div>
    </div>
  </section>
  <div class="foot">MADE TO BE TOUCHED · 2026</div>
</main>
<script>
(function(){
  'use strict';
  var canvas=document.getElementById('stage');
  var ctx=canvas.getContext('2d',{alpha:true});
  if(!ctx)return;
  var reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var springInput=document.getElementById('spring'),viscInput=document.getElementById('viscosity');
  var active=document.getElementById('active'),activeText=document.getElementById('active-text');
  var flavours={
    rose:{light:'#fff4e8',mid:'#f3b4b5',body:'#e9a0aa',edge:'#cb7a91',dark:'#9d526c',glow:'rgba(255,251,237,.90)'},
    taro:{light:'#fbf3ff',mid:'#d7c1f3',body:'#baa4e2',edge:'#9179c8',dark:'#6d589a',glow:'rgba(255,251,255,.93)'},
    matcha:{light:'#f6fbe7',mid:'#d2e8c0',body:'#b0d3ad',edge:'#83b69c',dark:'#548a77',glow:'rgba(255,255,238,.92)'}
  };
  var palette=flavours.rose;
  var TAU=Math.PI*2,SECTORS=44,RINGS=4;
  var particles=[],links=[],touches=new Map();
  var w=0,h=0,r=0,cx=0,cy=0,dpr=1,baseArea=0,hasMoved=false;
  var tick=0,last=0,accumulator=0;
  function clamp(n,a,b){return Math.min(b,Math.max(a,n));}
  function vid(ring,segment){return 1+(ring-1)*SECTORS+(segment+SECTORS)%SECTORS;}
  function edge(a,b,k){
    var p=particles[a],q=particles[b],dx=q.x-p.x,dy=q.y-p.y;
    links.push({a:a,b:b,d:Math.hypot(dx,dy),k:k});
  }
  function build(){
    particles=[];links=[];touches.clear();hasMoved=false;
    cx=w*.5;cy=h*(h<620?.49:(w<650?.49:.53));
    r=Math.min(w*(w<650?.343:.245),h*(w<650?.205:.275),268);
    r=Math.max(74,r);
    particles.push({x:cx,y:cy,px:cx,py:cy,ox:cx,oy:cy});
    var rs=[.24,.48,.74,1];
    for(var ring=1;ring<=RINGS;ring++){
      for(var i=0;i<SECTORS;i++){
        var theta=i*TAU/SECTORS,rr=r*rs[ring-1];
        var x=cx+Math.cos(theta)*rr,y=cy+Math.sin(theta)*rr;
        particles.push({x:x,y:y,px:x,py:y,ox:x,oy:y});
      }
    }
    for(var j=0;j<SECTORS;j++){
      edge(0,vid(1,j),.78);
      for(var k=1;k<=RINGS;k++){
        edge(vid(k,j),vid(k,j+1),.91);
        edge(vid(k,j),vid(k,j+2),.20);
        if(k>1){
          edge(vid(k-1,j),vid(k,j),.84);
          edge(vid(k-1,j),vid(k,j+1),.42);
          edge(vid(k-1,j+1),vid(k,j),.42);
        }
      }
    }
    baseArea=polygonArea();
    updateActive();
  }
  function polygonArea(){
    var a=0;
    for(var i=0;i<SECTORS;i++){
      var p=particles[vid(RINGS,i)],q=particles[vid(RINGS,i+1)];
      a+=p.x*q.y-q.x*p.y;
    }
    return Math.abs(a*.5);
  }
  function resize(){
    w=window.innerWidth;h=window.innerHeight;
    dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    build();
  }
  function updateActive(){
    var n=touches.size;active.classList.toggle('engaged',n>0);
    activeText.textContent=n?String(n).padStart(2,'0')+' POINT'+(n===1?'':'S')+' ACTIVE':'READY TO SQUISH';
    canvas.classList.toggle('grabbing',n>0);
  }
  function polygonPath(){
    var boundary=[];
    for(var i=0;i<SECTORS;i++)boundary.push(particles[vid(RINGS,i)]);
    ctx.beginPath();
    var first=boundary[0];ctx.moveTo(first.x,first.y);
    for(var j=0;j<SECTORS;j++){
      var p0=boundary[(j-1+SECTORS)%SECTORS],p1=boundary[j];
      var p2=boundary[(j+1)%SECTORS],p3=boundary[(j+2)%SECTORS];
      ctx.bezierCurveTo(p1.x+(p2.x-p0.x)/6,p1.y+(p2.y-p0.y)/6,
        p2.x-(p3.x-p1.x)/6,p2.y-(p3.y-p1.y)/6,p2.x,p2.y);
    }
    ctx.closePath();
  }
  function isInside(x,y){
    polygonPath();
    return ctx.isPointInPath(x,y);
  }
  function nearestIndex(x,y){
    var best=-1,bestD=Infinity,used=new Set();
    touches.forEach(function(t){used.add(t.index);});
    for(var i=0;i<particles.length;i++){
      if(used.has(i))continue;
      var p=particles[i],d=(p.x-x)*(p.x-x)+(p.y-y)*(p.y-y);
      if(d<bestD){bestD=d;best=i;}
    }
    return best;
  }
  function localPosition(e){var b=canvas.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top};}
  function down(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    var p=localPosition(e);
    if(!isInside(p.x,p.y)){
      // Permit gripping the very edge without making the whole background draggable.
      var nearest=Infinity;
      for(var k=0;k<SECTORS;k++){
        var b=particles[vid(RINGS,k)];
        nearest=Math.min(nearest,Math.hypot(b.x-p.x,b.y-p.y));
      }
      if(nearest>26)return;
    }
    e.preventDefault();
    try{canvas.setPointerCapture(e.pointerId);}catch(err){}
    var index=nearestIndex(p.x,p.y);
    if(index<0)return;
    var v=particles[index];
    var t={index:index,x:p.x,y:p.y,oldX:p.x,oldY:p.y,
      offsetX:p.x-v.x,offsetY:p.y-v.y,speedX:0,speedY:0,
      depth:0,pressure:e.pressure||.5};
    touches.set(e.pointerId,t);
    // A gentle poke propagates a wobble through the mesh.
    for(var i=0;i<particles.length;i++){
      var q=particles[i],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
      if(d<r*.75&&d>1){
        var impulse=(1-d/(r*.75))*1.4;
        q.px-=dx/d*impulse;q.py-=dy/d*impulse;
      }
    }
    updateActive();
  }
  function move(e){
    var t=touches.get(e.pointerId);if(!t)return;
    e.preventDefault();
    var p=localPosition(e);
    t.speedX=clamp(p.x-t.x,-43,43);t.speedY=clamp(p.y-t.y,-43,43);
    t.oldX=t.x;t.oldY=t.y;t.x=p.x;t.y=p.y;
    t.pressure=e.pressure||.5;
    if(Math.abs(t.speedX)+Math.abs(t.speedY)>1)hasMoved=true;
  }
  function up(e){
    var t=touches.get(e.pointerId);if(!t)return;
    var q=particles[t.index];
    q.px=q.x-t.speedX*.65;q.py=q.y-t.speedY*.65;
    touches.delete(e.pointerId);updateActive();
    try{canvas.releasePointerCapture(e.pointerId);}catch(err){}
  }
  canvas.addEventListener('pointerdown',down,{passive:false});
  canvas.addEventListener('pointermove',move,{passive:false});
  canvas.addEventListener('pointerup',up);
  canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('lostpointercapture',up);
  canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.getElementById('reset').addEventListener('click',build);
  springInput.addEventListener('input',function(){document.getElementById('spring-value').textContent=String(this.value).padStart(2,'0');});
  viscInput.addEventListener('input',function(){document.getElementById('viscosity-value').textContent=String(this.value).padStart(2,'0');});
  document.querySelectorAll('[data-flavour]').forEach(function(b){
    b.addEventListener('click',function(){
      palette=flavours[b.dataset.flavour];
      document.querySelectorAll('[data-flavour]').forEach(function(o){o.setAttribute('aria-pressed',String(o===b));});
    });
  });
  function simulate(){
    tick++;
    var damping=1-(Number(viscInput.value)*.013+0.016);
    var stiffness=.44+Number(springInput.value)*.048;
    var pinned=new Map();
    touches.forEach(function(t){
      t.depth=Math.min(1,t.depth+.07);
      pinned.set(t.index,t);
    });
    for(var i=0;i<particles.length;i++){
      var p=particles[i],dx=(p.x-p.px)*damping,dy=(p.y-p.py)*damping;
      p.px=p.x;p.py=p.y;
      if(pinned.has(i))continue;
      p.x+=dx+(p.ox-p.x)*.00055;
      p.y+=dy+(p.oy-p.y)*.00055;
      if(!reduceMotion&&touches.size===0&&i>1){
        p.y+=Math.sin(tick*.018+i*.11)*.008;
      }
    }
    // Small displacement around pressed points produces a pillowy squash.
    touches.forEach(function(t){
      var reach=r*.39;
      for(var i=1;i<particles.length;i++){
        if(pinned.has(i))continue;
        var p=particles[i],dx=p.x-t.x,dy=p.y-t.y,d=Math.hypot(dx,dy);
        if(d>2&&d<reach){
          var force=Math.pow(1-d/reach,2)*t.depth*.8;
          p.x+=dx/d*force;p.y+=dy/d*force;
        }
      }
    });
    for(var iteration=0;iteration<6;iteration++){
      pinned.forEach(function(t,index){
        var p=particles[index];p.x=t.x-t.offsetX;p.y=t.y-t.offsetY;
      });
      for(var c=0;c<links.length;c++){
        var l=links[c],a=particles[l.a],b=particles[l.b];
        var dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);
        if(dist<.001)continue;
        var wa=pinned.has(l.a)?0:1,wb=pinned.has(l.b)?0:1,weight=wa+wb;
        if(!weight)continue;
        var corr=(dist-l.d)/dist*l.k*stiffness;
        a.x+=dx*corr*(wa/weight);a.y+=dy*corr*(wa/weight);
        b.x-=dx*corr*(wb/weight);b.y-=dy*corr*(wb/weight);
      }
      // Approximate incompressibility: pulling it wider makes it thinner.
      var area=polygonArea(),diff=clamp(baseArea/(area||1)-1,-.75,1.0);
      var puff=diff*.011;
      var mx=0,my=0;
      for(var j=0;j<SECTORS;j++){var o=particles[vid(RINGS,j)];mx+=o.x;my+=o.y;}
      mx/=SECTORS;my/=SECTORS;
      for(var j=0;j<SECTORS;j++){
        var index=vid(RINGS,j),o=particles[index];
        if(pinned.has(index))continue;
        o.x+=(o.x-mx)*puff;o.y+=(o.y-my)*puff;
      }
    }
    pinned.forEach(function(t,index){
      var p=particles[index];p.x=t.x-t.offsetX;p.y=t.y-t.offsetY;
      p.px=p.x-t.speedX*.13;p.py=p.y-t.speedY*.13;
      t.speedX*=.52;t.speedY*=.52;
    });
  }
  function texturePoint(angle,radial){
    var f=((angle%TAU)+TAU)%TAU/TAU*SECTORS;
    var i=Math.floor(f),a=f-i;
    var ring=clamp(Math.ceil(radial*RINGS),1,RINGS);
    var low=ring===1?0:ring-1;
    var q=clamp(radial*RINGS-(ring-1),0,1);
    function sample(k){
      var v0=k===0?particles[0]:particles[vid(k,i)];
      var v1=k===0?particles[0]:particles[vid(k,i+1)];
      return{x:v0.x+(v1.x-v0.x)*a,y:v0.y+(v1.y-v0.y)*a};
    }
    var p0=sample(low),p1=sample(ring);
    return{x:p0.x+(p1.x-p0.x)*q,y:p0.y+(p1.y-p0.y)*q};
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity,midX=0,midY=0;
    for(var i=0;i<SECTORS;i++){
      var b=particles[vid(RINGS,i)];
      minX=Math.min(minX,b.x);maxX=Math.max(maxX,b.x);
      minY=Math.min(minY,b.y);maxY=Math.max(maxY,b.y);
      midX+=b.x;midY+=b.y;
    }
    midX/=SECTORS;midY/=SECTORS;
    var spanX=Math.max(20,maxX-minX),spanY=Math.max(20,maxY-minY);
    var rr=Math.max(spanX,spanY)*.52;
    // Atmospheric contact shadow, always behind the jelly.
    ctx.save();
    var floorY=clamp(maxY+17,cy+r*.88,h*.80);
    ctx.translate(midX,floorY);
    ctx.scale(Math.max(30,spanX*.58),Math.max(14,r*.18));
    var shadow=ctx.createRadialGradient(0,0,.04,0,0,1);
    shadow.addColorStop(0,'rgba(135,86,91,.20)');
    shadow.addColorStop(.55,'rgba(135,86,91,.10)');
    shadow.addColorStop(1,'rgba(135,86,91,0)');
    ctx.fillStyle=shadow;ctx.beginPath();ctx.arc(0,0,1,0,TAU);ctx.fill();ctx.restore();
    ctx.save();
    polygonPath();
    ctx.shadowColor='rgba(141,75,96,.26)';ctx.shadowBlur=Math.min(48,r*.23);
    ctx.shadowOffsetY=13;
    var fill=ctx.createRadialGradient(midX-spanX*.24,minY+spanY*.18,spanX*.03,midX+spanX*.12,midY+spanY*.14,rr*1.4);
    fill.addColorStop(0,palette.light);fill.addColorStop(.34,palette.mid);
    fill.addColorStop(.69,palette.body);fill.addColorStop(1,palette.edge);
    ctx.fillStyle=fill;ctx.fill();
    ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    ctx.clip();
    // Inner light diffusion and translucent lower rim.
    var gloss=ctx.createRadialGradient(midX-spanX*.23,minY+spanY*.18,0,midX-spanX*.12,midY,spanX*.83);
    gloss.addColorStop(0,'rgba(255,255,255,.63)');gloss.addColorStop(.34,'rgba(255,255,255,.11)');gloss.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gloss;ctx.fillRect(minX-50,minY-50,spanX+100,spanY+100);
    var bottom=ctx.createLinearGradient(0,midY,0,maxY);
    bottom.addColorStop(0,'rgba(112,59,78,0)');
    bottom.addColorStop(1,'rgba(100,51,76,.13)');
    ctx.fillStyle=bottom;ctx.fillRect(minX-25,midY,spanX+50,spanY);
    // Stretchable satin-like broad reflection.
    var gl=texturePoint(4.04,.56),gl2=texturePoint(5.2,.65);
    var sheen=ctx.createRadialGradient(gl.x,gl.y,2,gl.x,gl.y,Math.max(30,r*.47));
    sheen.addColorStop(0,palette.glow);sheen.addColorStop(.4,'rgba(255,255,255,.25)');
    sheen.addColorStop(1,'rgba(255,255,255,0)');
    ctx.save();ctx.translate(gl.x,gl.y);ctx.rotate(-.52);ctx.scale(1.45,.72);
    ctx.fillStyle=sheen;ctx.beginPath();ctx.arc(0,0,Math.max(35,r*.47),0,TAU);ctx.fill();ctx.restore();
    // Surface pores follow the soft-body mesh (no static texture sliding).
    for(var i=0;i<100;i++){
      var angle=i*2.399963229728653,radial=.11+.77*Math.sqrt(((i*37)%101)/101);
      var tp=texturePoint(angle,radial);
      ctx.beginPath();ctx.arc(tp.x,tp.y,i%7===0?1.2:.55,0,TAU);
      ctx.fillStyle=i%3===0?'rgba(255,255,255,.25)':'rgba(139,75,91,.085)';
      ctx.fill();
    }
    // A subtle compression dimple appears under each fingertip.
    touches.forEach(function(t){
      var depth=t.depth||.2,rad=Math.max(27,r*.23);
      var contact=ctx.createRadialGradient(t.x,t.y,1,t.x,t.y,rad);
      contact.addColorStop(0,'rgba(117,55,72,'+(.13*depth)+')');
      contact.addColorStop(.36,'rgba(144,76,88,'+(.085*depth)+')');
      contact.addColorStop(.77,'rgba(255,255,255,'+(.11*depth)+')');
      contact.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=contact;ctx.beginPath();ctx.arc(t.x,t.y,rad,0,TAU);ctx.fill();
    });
    ctx.restore();
    // Soft edge highlights add apparent thickness.
    polygonPath();ctx.lineWidth=Math.max(2.1,r*.018);
    ctx.strokeStyle='rgba(255,255,255,.47)';ctx.stroke();
    polygonPath();ctx.lineWidth=1.1;ctx.strokeStyle='rgba(124,69,86,.16)';ctx.stroke();
    // The small glossy flick moves with the material.
    ctx.save();
    var dot=texturePoint(3.93,.55);
    ctx.translate(dot.x,dot.y);ctx.rotate(-.49);
    ctx.fillStyle='rgba(255,255,255,.61)';ctx.beginPath();
    ctx.ellipse(0,0,Math.max(8,r*.09),Math.max(3,r*.026),0,0,TAU);ctx.fill();
    ctx.restore();
  }
  function frame(now){
    if(!last)last=now;
    accumulator+=Math.min(48,now-last);last=now;
    var n=0;
    while(accumulator>=16.6667&&n++<3){simulate();accumulator-=16.6667;}
    draw();requestAnimationFrame(frame);
  }
  window.addEventListener('resize',resize,{passive:true});
  document.addEventListener('visibilitychange',function(){last=performance.now();accumulator=0;});
  resize();requestAnimationFrame(frame);
})();
</script>
