<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf6f1">
  <meta name="description" content="MOCHI LAB — 用手指揉捏一顆有彈性、有重量、會回彈的數位麻糬。支援多點觸控。">
  <title>MOCHI LAB — 3D Soft Touch</title>
  <style>
    :root{--ink:#493b3d;--muted:#958a87;--paper:#faf6f1;--line:#e9dfd9;--accent:#d58c98;--ui:#fffdfa}
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink);background:var(--paper);overflow:hidden;-webkit-font-smoothing:antialiased}
    button,input{font:inherit;-webkit-tap-highlight-color:transparent}
    button:focus-visible,input:focus-visible{outline:2px solid #ad7a94;outline-offset:3px}
    .app{position:relative;width:100%;height:100vh;height:100dvh;min-height:400px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 50% 52% at 50% 49%,#fceae6 0%,#fbf4ed 67%,#f9f5f0 100%)}
    .app:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.38;background-image:radial-gradient(#d9c9c2 0.75px,transparent 0.9px);background-size:23px 23px;mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 80%,transparent)}
    .wash{position:absolute;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(circle at 20% 55%,#edc6be58,transparent 31%),radial-gradient(circle at 78% 34%,#ddcee04d,transparent 35%);filter:blur(22px)}
    .circle{position:absolute;z-index:0;border:1px solid #d3b8b128;border-radius:50%;pointer-events:none}
    .circle.a{width:min(70vw,770px);aspect-ratio:1;left:50%;top:53%;transform:translate(-50%,-50%)}
    .circle.b{width:min(56vw,590px);aspect-ratio:1;left:50%;top:53%;transform:translate(-50%,-50%)}
    .topbar{position:absolute;z-index:7;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:calc(25px + env(safe-area-inset-top)) clamp(22px,4vw,62px)}
    .identity{display:flex;align-items:center;gap:13px;font-size:11px;font-weight:750;letter-spacing:.18em;white-space:nowrap}
    .mark{width:32px;height:32px;border-radius:48% 52% 56% 44%;background:linear-gradient(145deg,#fff9f2,#f0a8b6);box-shadow:inset -3px -4px 8px #d88f9a9c,0 3px 9px #cfacaa55;transform:rotate(-13deg)}
    .edition{font-size:10px;letter-spacing:.19em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
    .restart{border:1px solid #e3d4d1;background:#fffbf8b9;color:#6b5557;border-radius:999px;padding:10px 17px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.09em;transition:background .18s,transform .18s}
    .restart:hover{background:#fff;transform:translateY(-2px)}
    .restart svg{width:14px;height:14px}
    .headline{position:absolute;z-index:1;top:clamp(90px,12vh,155px);left:0;right:0;text-align:center;pointer-events:none;user-select:none}
    .eyebrow{font-size:10px;font-weight:700;letter-spacing:.45em;color:#b69996;margin:0 0 13px}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(66px,11vw,144px);font-weight:400;letter-spacing:-.075em;line-height:.9;color:#d9c7c0a6;margin:0}
    h1 em{font-style:italic;font-weight:400;color:#d7bcb7ab}
    .subline{margin-top:18px;color:#b49e9a;font-size:11px;letter-spacing:.22em}
    #stage{position:absolute;z-index:3;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
    #stage.grabbing{cursor:grabbing}
    .side-note{position:absolute;z-index:4;top:50%;left:clamp(20px,4vw,68px);transform:translateY(-50%);pointer-events:none}
    .side-note .line{width:1px;height:36px;background:#cbb0ad;margin:0 0 18px 1px}
    .side-note p{font-size:10px;line-height:2.1;letter-spacing:.18em;color:#9e8987;margin:0;text-transform:uppercase}
    .side-note strong{display:block;font-size:12px;letter-spacing:.06em;color:#775e61;margin-top:3px}
    .active{position:absolute;z-index:4;right:clamp(20px,4vw,65px);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:9px;color:#998580;font-size:10px;font-weight:700;letter-spacing:.12em;pointer-events:none}
    .active-dot{height:7px;width:7px;border-radius:50%;background:#d1c3be;box-shadow:0 0 0 5px #d1c3be25;transition:background .18s}
    .active.engaged .active-dot{background:#d77f91;box-shadow:0 0 0 5px #d77f9130}
    .bottom{position:absolute;z-index:8;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(780px,calc(100% - 36px));display:flex;flex-direction:column;align-items:center;gap:17px}
    .instruction{text-align:center;font-size:12px;line-height:1.7;letter-spacing:.12em;color:#886e6e;pointer-events:none;text-shadow:0 1px 4px #fff}
    .instruction strong{font-weight:750;color:#654e52}
    .panel{width:100%;min-height:86px;display:flex;justify-content:space-between;align-items:center;gap:22px;background:#fffdfacb;border:1px solid #fff;border-radius:23px;padding:17px 25px;box-shadow:0 15px 50px #98716b15,0 2px 9px #9c726a0a;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
    .control{display:flex;flex-direction:column;min-width:145px;gap:10px;flex:1}
    .control-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
    .control label,.swatches .label{font-size:10px;font-weight:800;letter-spacing:.16em;color:#725c60}
    .value{font-family:Georgia,serif;font-size:11px;color:#ac9391}
    input[type=range]{width:100%;margin:0;appearance:none;-webkit-appearance:none;background:transparent;height:15px;cursor:pointer}
    input[type=range]::-webkit-slider-runnable-track{background:#e7d9d5;height:3px;border-radius:99px}
    input[type=range]::-moz-range-track{background:#e7d9d5;height:3px;border-radius:99px}
    input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;margin-top:-6px;width:15px;height:15px;border:3px solid #fff;border-radius:50%;background:#cb8c95;box-shadow:0 1px 5px #ab7e7770}
    input[type=range]::-moz-range-thumb{width:12px;height:12px;border:3px solid #fff;border-radius:50%;background:#cb8c95;box-shadow:0 1px 5px #ab7e7770}
    .separator{width:1px;height:37px;background:#eee4df;flex:none}
    .swatches{display:flex;flex-direction:column;gap:9px;min-width:120px}
    .swatch-row{display:flex;align-items:center;gap:10px}
    .swatch{width:23px;height:23px;flex:none;border:2px solid #fff;border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px #d5c1bc80;transition:transform .2s,box-shadow .2s}
    .swatch:hover{transform:scale(1.14)}
    .swatch[aria-pressed=true]{box-shadow:0 0 0 2px #816466,0 0 0 4px #fff}
    .swatch.rose{background:linear-gradient(135deg,#ffebdc,#dd889d)}.swatch.taro{background:linear-gradient(135deg,#f3e9ff,#aa92d7)}.swatch.matcha{background:linear-gradient(135deg,#e7f6d7,#8dbd9c)}
    .foot{position:absolute;z-index:4;bottom:19px;left:32px;color:#a89a96;font-size:9px;letter-spacing:.2em;pointer-events:none}
    @media(max-width:900px){.side-note{top:57%;left:22px}.active{top:57%;right:22px}.side-note p{font-size:9px}.active{font-size:9px}}
    @media(max-width:650px){
      .topbar{padding:calc(13px + env(safe-area-inset-top)) 18px}
      .edition{display:none}.identity{font-size:10px}.mark{width:27px;height:27px}
      .restart{padding:9px 13px;font-size:10px}
      .headline{top:clamp(96px,15vh,144px)}h1{font-size:clamp(65px,20vw,95px)}
      .eyebrow{font-size:9px;margin-bottom:10px}.subline{margin-top:12px;font-size:9px}
      .side-note{top:auto;bottom:clamp(207px,27vh,250px);left:20px;transform:none}
      .side-note .line{height:18px;margin-bottom:8px}.side-note p{font-size:8px;line-height:1.75}.side-note strong{font-size:9px}
      .active{top:auto;bottom:clamp(213px,28vh,250px);right:20px;transform:none;font-size:8px}
      .bottom{width:calc(100% - 24px);bottom:max(12px,env(safe-area-inset-bottom));gap:11px}
      .instruction{font-size:11px;letter-spacing:.055em}
      .panel{padding:14px 15px;gap:10px;border-radius:18px;min-height:76px}
      .control{min-width:0;gap:9px}.control label,.swatches .label{font-size:9px;letter-spacing:.03em}.value{font-size:10px}
      .separator{height:37px}.swatches{min-width:95px}.swatch-row{gap:8px}.swatch{width:21px;height:21px}
      .foot{display:none}
    }
    @media(max-width:370px){.panel{gap:8px;padding:13px 11px}.swatches{min-width:80px}.swatch-row{gap:5px}.swatch{width:19px;height:19px}.control label{font-size:8px}}
    @media(max-height:620px){.headline{top:70px}.side-note,.active{display:none}.instruction{display:none}.bottom{bottom:max(9px,env(safe-area-inset-bottom))}.panel{min-height:70px;padding-block:11px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:0s!important;animation-duration:0s!important}}
  
/* WebGL 3D surface: softly blurred drop-shadow behind the actual lit mesh */
#shadow3d{position:absolute;z-index:2;left:50%;top:58%;width:240px;height:64px;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(120,70,84,.31) 0%,rgba(148,88,96,.15) 42%,rgba(148,88,96,0) 75%);
  filter:blur(14px);opacity:.78;will-change:transform}
#stage{background:transparent}
@media(max-width:650px){#shadow3d{filter:blur(11px)}}
</style>
</head>
<body>
<main class="app" aria-label="麻糬物理互動實驗室">
  <div class="wash" aria-hidden="true"></div>
  <div class="circle a" aria-hidden="true"></div><div class="circle b" aria-hidden="true"></div>
  <header class="topbar">
    <div class="identity"><span class="mark" aria-hidden="true"></span><span>SOFT MATTER STUDIO</span><span class="edition">/ EXPERIMENT NO. 001</span></div>
    <button class="restart" id="reset" type="button" aria-label="重置麻糬形狀"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.5 6.5"/><path d="M3 4v7h7"/></svg>重新揉捏</button>
  </header>
  <div class="headline" aria-hidden="true">
    <p class="eyebrow">A LITTLE SOFTER EVERY DAY</p>
    <h1>mochi<em>.</em></h1>
    <div class="subline">THE INTERACTIVE SQUISH EXPERIMENT</div>
  </div>
  <div id="shadow3d" aria-hidden="true"></div>
  <canvas id="stage" aria-label="可單指按出3D凹陷、多指拉伸的立體軟彈麻糬"></canvas>
  <div class="side-note" aria-hidden="true"><div class="line"></div><p>TOUCH / STRETCH<br>SQUISH / RELEASE</p><strong>隨心揉捏</strong></div>
  <div class="active" id="active" aria-live="polite"><span class="active-dot"></span><span id="active-text">READY TO SQUISH</span></div>
  <section class="bottom" aria-label="物理材質控制">
    <div class="instruction"><strong>伸出手指，揉一揉。</strong> 單指按出凹陷與陰影，多指拉伸，鬆手後柔軟回彈。</div>
    <div class="panel">
      <div class="control"><div class="control-head"><label for="spring">彈性 ELASTICITY</label><span class="value" id="spring-value">07</span></div><input id="spring" type="range" min="1" max="10" value="7" aria-label="彈性"></div>
      <span class="separator" aria-hidden="true"></span>
      <div class="control"><div class="control-head"><label for="viscosity">黏性 VISCOSITY</label><span class="value" id="viscosity-value">06</span></div><input id="viscosity" type="range" min="1" max="10" value="6" aria-label="黏性"></div>
      <span class="separator" aria-hidden="true"></span>
      <div class="swatches"><span class="label">口味 FLAVOUR</span><div class="swatch-row" role="group" aria-label="麻糬顏色">
        <button class="swatch rose" data-flavour="rose" aria-label="蜜桃粉" aria-pressed="true"></button>
        <button class="swatch taro" data-flavour="taro" aria-label="芋泥紫" aria-pressed="false"></button>
        <button class="swatch matcha" data-flavour="matcha" aria-label="抹茶綠" aria-pressed="false"></button>
      </div></div>
    </div>
  </section>
  <div class="foot">MADE TO BE TOUCHED · 2026</div>
</main>
<script src="mochi-3d.js" defer></script>
</body>
</html>
