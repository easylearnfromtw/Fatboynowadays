<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>日本幕 · 浮世繪庭園 | Fatboy Nowadays</title><style>*{box-sizing:border-box}html,body{margin:0;background:#211b27;color:#fff8f0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}/* v0.7 | approved ukiyo-e illustration with separately animated original-art details */

.j-shoji:before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#ffffff45,transparent 45%,#2a191c44),radial-gradient(ellipse at 70% 80%,#eab3b555,transparent 60%);mix-blend-mode:soft-light}
.j-shoji:after{content:'';position:absolute;top:0;bottom:0;width:12px;right:0;background:linear-gradient(90deg,#22171a,#8b5749 40%,#2c1d20);box-shadow:-3px 0 10px #150d13a6}
.j-shoji-left{left:0}.j-shoji-right{right:0}.j-shoji-right:after{right:auto;left:0}
.j-copy{position:absolute;z-index:8;right:4.5%;top:29%;width:min(37vw,430px);opacity:0;pointer-events:none;will-change:transform,opacity;text-shadow:0 3px 19px #110e16}
.j-eyebrow{font-size:11px;letter-spacing:.28em;color:#f1c88f;font-weight:600}
.j-copy h2{font-family:'Songti TC','Noto Serif TC',serif;font-weight:500;font-size:clamp(30px,4.2vw,59px);line-height:1.4;letter-spacing:.1em;margin:20px 0}
.j-copy p{font-size:14px;line-height:1.95;letter-spacing:.07em;margin:12px 0;color:#fff0d9}
.j-copy .j-caption{font-size:11px;opacity:.82}
.j-stage-label{position:absolute;z-index:12;top:max(23px,env(safe-area-inset-top));left:clamp(20px,4vw,66px);font-size:11px;letter-spacing:.16em;color:#ffe3b1;text-shadow:0 2px 10px #140d11}
.j-preview-link{position:absolute;z-index:12;right:clamp(18px,3vw,60px);bottom:max(25px,env(safe-area-inset-bottom));display:inline-block;background:#241821ba;color:#fff0d6;border:1px solid #f9dcb5a1;border-radius:999px;padding:12px 20px;text-decoration:none;backdrop-filter:blur(7px);font-size:12px;letter-spacing:.04em}
.j-preview-link:focus-visible,.j-preview-link:hover{background:#62414b;color:white}
.j-scene-hint{position:absolute;z-index:12;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#ffe1b2;letter-spacing:.15em;text-shadow:0 2px 10px #23121b}
@media(max-width:800px){
 .j-scroll-track{height:325svh;min-height:1600px}
 .j-stage{min-height:0}
 .j-art{left:50%;height:101%;box-shadow:none}
 .j-ambient{filter:blur(30px) brightness(.48)}
 .j-stage:after{background:linear-gradient(0deg,#130d16b0 0%,transparent 35%,transparent 70%,#1c111c22)}
 .j-copy{top:auto;bottom:12%;left:19px;right:19px;width:auto;max-width:355px;text-shadow:0 2px 15px #130e19}
 .j-copy h2{font-size:clamp(25px,7vw,34px);margin:8px 0 12px}
 .j-copy p{font-size:12px;line-height:1.65;margin:6px 0}
 .j-stage-label{font-size:9px}
 .j-preview-link{bottom:max(18px,env(safe-area-inset-bottom));right:18px;font-size:11px;padding:10px 14px}
 .j-scene-hint{bottom:76px;font-size:10px}
}
@media(prefers-reduced-motion:reduce){.j-shoji,.j-art,.j-overlay-canopy,.j-overlay-petals,.j-overlay-tea,.j-petal{transition:none!important}}
</style></head><body><div class="j-scroll-track" id="japan-track">

      <p class="j-caption">本幕為已選定插畫的互動場景；古代日本體態史的五個案例將在後續章節依史料逐一展開。</p>

</div>
<section style="padding:90px 18px 110px;text-align:center;background:#231d27;line-height:2"><h2 style="font-family:serif;font-size:32px;font-weight:400">浮世繪 · 皮影舞台試看</h2><p style="max-width:600px;margin:auto">這一版採用你親自選定的原圖；障子、櫻花、茶桌前景與漂浮花瓣分層呈現，全部由滾動位置控制。完整角色關節動畫將另外製作。</p><p><a style="color:#f4d5ab" href="../">返回完整網站</a></p></section><script>
(function(){
 'use strict';
 const track=document.getElementById('japan-track');if(!track)return;
 const get=id=>document.getElementById(id);
 const art=get('japan-art'),left=get('japan-door-left'),right=get('japan-door-right');
 const canopy=get('japan-canopy'),foreground=get('japan-foreground'),tea=get('japan-tea');
 const copy=get('japan-copy'),hint=get('japan-hint');
 const petals=Array.from(track.querySelectorAll('.j-petal'));
 const clamp=t=>Math.max(0,Math.min(1,t));
 const ease=t=>{t=clamp(t);return t*t*(3-2*t)};
 let queued=false;
 function draw(){
  queued=false;
  const end=Math.max(1,track.offsetHeight-window.innerHeight);
  const p=clamp(-track.getBoundingClientRect().top/end);
  const open=ease((p-.06)/.35),pull=ease((p-.06)/.80);
  // The user controls the animation directly. Scroll upward to reverse.
  left.style.transform='translate3d('+(-108*open).toFixed(3)+'%,0,0)';
  right.style.transform='translate3d('+(108*open).toFixed(3)+'%,0,0)';
  art.style.transform='translate3d(-50%,-50%,0) scale('+(1.11-.11*pull).toFixed(4)+')';
  // Transparent cutouts derived from the approved image, not substitute SVG art.
  canopy.style.transform='translate3d('+(-5*pull).toFixed(2)+'px,'+(-9*pull).toFixed(2)+'px,0)';
  foreground.style.transform='translate3d('+(5*pull).toFixed(2)+'px,'+(-5*pull).toFixed(2)+'px,0)';
  tea.style.transform='translate3d('+(3*pull).toFixed(2)+'px,'+(-3*pull).toFixed(2)+'px,0)';
  petals.forEach((el,i)=>{
   const dx=(i%2===0?1:-1)*(10+5*i)*pull,dy=(8+13*i)*pull;
   el.style.transform='translate3d('+dx.toFixed(2)+'px,'+dy.toFixed(2)+'px,0) rotate('+(25+30*pull).toFixed(1)+'deg)';
  });
  const visible=ease((p-.49)/.25);
  copy.style.opacity=visible.toFixed(3);
  copy.style.transform='translate3d(0,'+((1-visible)*16).toFixed(2)+'px,0)';
  hint.style.opacity=(1-ease((p-.14)/.15)).toFixed(3);
 }
 function request(){if(!queued){queued=true;requestAnimationFrame(draw)}}
 window.addEventListener('scroll',request,{passive:true});
 window.addEventListener('resize',request,{passive:true});
 window.addEventListener('orientationchange',request,{passive:true});
 draw();
})();
</script>
